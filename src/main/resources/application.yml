springdoc:
  packages-to-scan: org.sopt
  paths-to-match: /api/**
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

spring:
  application:
    name: assignment

  profiles:
    # 활성 프로필을 지정하지 않으면 local 프로필 사용
    default: local

  datasource:
    url: jdbc:mysql://localhost:3306/assignment
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200
        one-indexed-parameters: true
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
